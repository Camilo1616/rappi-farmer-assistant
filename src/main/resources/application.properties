
spring.profiles.active=local

# Base de datos
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/rappi_farmer_assistant}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Servidor
server.port=8080

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000

# CORS (origen del frontend React en desarrollo)
cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:4173}

# Google OAuth
google.oauth.client-id=${GOOGLE_CLIENT_ID:}
google.oauth.client-secret=${GOOGLE_CLIENT_SECRET:}

# Google Calendar
google.calendar.client-id=${GOOGLE_CALENDAR_CLIENT_ID:}
google.calendar.client-secret=${GOOGLE_CALENDAR_CLIENT_SECRET:}
google.calendar.redirect-uri=${GOOGLE_CALENDAR_REDIRECT_URI:http://localhost:8080/api/auth/google/calendar/callback}

# Email
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.default-encoding=UTF-8

# Subida de archivos Excel
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
