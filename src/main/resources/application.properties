
spring.profiles.active=local

# Base de datos
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/rappi_assistant}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Servidor
server.port=8080

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=18000000

# CORS (origen del frontend React en desarrollo)
cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:4173}

# URL principal del frontend
frontend.url=${FRONTEND_URL:http://localhost:5173}

# Microservicio WhatsApp
whatsapp.service.url=${WHATSAPP_SERVICE_URL:http://localhost:3000}
whatsapp.service.api-key=${WHATSAPP_SERVICE_API_KEY:}

# Email (Resend)
resend.api.key=${RESEND_API_KEY:}
