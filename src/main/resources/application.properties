
spring.profiles.active=local

# Base de datos
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/rappi_farmer_assistant}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Servidor
server.port=8080

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=18000000

# CORS (origen del frontend React en desarrollo)
cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:4173}

# URL principal del frontend (para redirects OAuth)
frontend.url=${FRONTEND_URL:http://localhost:5173}

# Google OAuth
google.oauth.client-id=${GOOGLE_CLIENT_ID:}
google.oauth.client-secret=${GOOGLE_CLIENT_SECRET:}
google.oauth.redirect-uri=${GOOGLE_OAUTH_REDIRECT_URI:http://localhost:8080/api/auth/google/callback}

# Google Calendar
google.calendar.client-id=${GOOGLE_CALENDAR_CLIENT_ID:}
google.calendar.client-secret=${GOOGLE_CALENDAR_CLIENT_SECRET:}
google.calendar.redirect-uri=${GOOGLE_CALENDAR_REDIRECT_URI:http://localhost:8080/api/auth/google/calendar/callback}

# Microservicio WhatsApp (Baileys)
whatsapp.service.url=${WHATSAPP_SERVICE_URL:http://localhost:3000}
whatsapp.service.api-key=${WHATSAPP_SERVICE_API_KEY:}

# Código de invitación para rol LIDER (vacío = desactivado)
lider.invite.code=${LIDER_INVITE_CODE:}

# Email (Resend)
resend.api.key=${RESEND_API_KEY:}

# Subida de archivos Excel
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Groq AI
groq.api.key=${GROQ_API_KEY:}
